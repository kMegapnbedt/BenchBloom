<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img"
     aria-label="benchbloom pipeline: corpus ingested, normalized, hashed into MinHash signatures, matched">
  <defs>
    <linearGradient id="stem" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2f6b3a"/>
      <stop offset="1" stop-color="#6fbf73"/>
    </linearGradient>
    <radialGradient id="petal" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.6" stop-color="#f6a5c0"/>
      <stop offset="1" stop-color="#c65b7c"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.6"/></filter>
  </defs>

  <rect width="720" height="240" fill="#0f1a12"/>
  <text x="24" y="34" fill="#a9d9b2" font-family="monospace" font-size="16">benchbloom · contamination forensics</text>

  <!-- pipeline stages -->
  <g font-family="monospace" font-size="12" fill="#7fae86">
    <text x="60"  y="210">ingest</text>
    <text x="210" y="210">normalize</text>
    <text x="380" y="210">MinHash</text>
    <text x="560" y="210">match</text>
  </g>

  <!-- flowing spores along the pipeline -->
  <g fill="#9fe6ad">
    <circle r="4" cx="0" cy="0">
      <animateMotion dur="4s" repeatCount="indefinite"
        path="M70,150 C180,120 300,180 400,140 C500,110 600,150 640,140"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" cx="0" cy="0" fill="#f6a5c0">
