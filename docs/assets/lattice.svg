<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img"
     aria-label="MinHash signature lattice: two spore prints overlapping to reveal shared shingles">
  <defs>
    <radialGradient id="ref" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8fd6a0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#2f6b3a" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="sub" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6a5c0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c65b7c" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="520" height="320" fill="#101712"/>
  <text x="20" y="30" fill="#a9d9b2" font-family="monospace" font-size="15">signature lattice · shared shingles glow</text>

  <!-- spore-print lattice of the reference corpus -->
  <g stroke="#3a5c42" stroke-width="0.6" opacity="0.5">
    <g id="grid"/>
    <path d="M60,60 H460 M60,110 H460 M60,160 H460 M60,210 H460 M60,260 H460"/>
    <path d="M110,50 V270 M180,50 V270 M250,50 V270 M320,50 V270 M390,50 V270"/>
  </g>

  <!-- two overlapping signature clouds that drift together -->
  <g>
    <circle cx="200" cy="170" r="80" fill="url(#ref)">
      <animate attributeName="cx" values="200;235;200" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="170" r="80" fill="url(#sub)">
